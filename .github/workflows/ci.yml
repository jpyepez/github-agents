name: CI

# Lints the workflows and shell scripts, and tests and typechecks scripts/. Every consumer
# repo runs these scripts, so they get checked on every PR. This repo has no issue automation.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck
      - run: bun run typecheck
      - run: bun run test
